<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify Form Detection Stub</title>
</head>
<body>
  <!-- Static form stub for Netlify build bots to detect the contact form -->
  <form name="contact-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact-enquiry" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="resort" />
    <input type="date" name="checkIn" />
    <input type="date" name="checkOut" />
    <input type="number" name="guests" />
    <input type="text" name="enquiryType" />
    <textarea name="message"></textarea>
    <input type="checkbox" name="consent" />
  </form>
</body>
</html>
